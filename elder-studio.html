<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heirloom Audio - Studio</title>
    <style>
        /* CSS: Clean, High-Contrast, Zero-Waste Styling */
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --btn-green: #2ecc71;
            --btn-red: #e74c3c;
            --btn-gray: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            /* Prevents accidental double-tap zooming */
            touch-action: manipulation; 
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .prompt-container {
            margin-bottom: 40px;
            max-width: 600px;
        }

        .greeting {
            font-size: 1.2rem;
            color: #aaaaaa;
            margin-bottom: 10px;
        }

        .question {
            font-size: 2rem;
            font-weight: bold;
            line-height: 1.3;
        }

        /* Tremor-Proof Button Design */
        .record-btn {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: none;
            background-color: var(--btn-green);
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: background-color 0.3s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .record-btn:active {
            transform: scale(0.95);
        }

        /* Recording State pulsing animation */
        .recording {
            background-color: var(--btn-red) !important;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
            70% { box-shadow: 0 0 0 30px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        .status-text {
            margin-top: 30px;
            font-size: 1.2rem;
            height: 24px; /* fixed height prevents layout jumping */
            color: #aaaaaa;
        }

        .spontaneous-btn {
            margin-top: 40px;
            padding: 15px 30px;
            background-color: var(--btn-gray);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <div class="prompt-container" id="promptContainer">
        <div class="greeting">Sunday's Question:</div>
        <div class="question" id="promptText">What is your favorite memory of your grandfather?</div>
    </div>

    <!-- The Massive Tremor-Proof Toggle Button -->
    <button class="record-btn" id="recordBtn">
        Start<br>Recording
    </button>

    <div class="status-text" id="statusText">Ready when you are.</div>

    <!-- Freestyle Recording Option -->
    <button class="spontaneous-btn" id="spontaneousBtn">Record a Spontaneous Memory</button>

    <script>
        // JavaScript: The Logic Engine
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        const recordBtn = document.getElementById('recordBtn');
        const statusText = document.getElementById('statusText');
        const promptText = document.getElementById('promptText');
        const spontaneousBtn = document.getElementById('spontaneousBtn');

        // Tremor-proof click handler: Only fires once per distinct tap
        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                await startRecording();
            } else {
                stopRecording();
            }
        });

        // Spontaneous Memory override
        spontaneousBtn.addEventListener('click', () => {
            promptText.innerText = "I remembered something I wanted to share...";
            document.querySelector('.greeting').innerText = "Spontaneous Memory";
            spontaneousBtn.style.display = "none"; // Hide button while in this mode
        });

        async function startRecording() {
            try {
                // Request microphone access
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                        // FAILSAFE LOGIC: This is where we will write the chunk to IndexedDB 
                        // so it is saved locally to the phone memory instantly.
                    }
                };

                mediaRecorder.onstop = handleAudioSave;

                // Start recording
                mediaRecorder.start();
                isRecording = true;

                // Update UI to Red "Stop" state
                recordBtn.classList.add('recording');
                recordBtn.innerHTML = "Stop<br>Recording";
                statusText.innerText = "Listening... (Tap when finished)";

            } catch (err) {
                statusText.innerText = "Please allow microphone access to record.";
                console.error("Mic error:", err);
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                // Stop all mic tracks to free up the hardware
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
            
            isRecording = false;

            // Update UI back to processing state
            recordBtn.classList.remove('recording');
            recordBtn.style.backgroundColor = "#555"; // Greyed out while saving
            recordBtn.innerHTML = "Saving...";
            statusText.innerText = "Securing your memory...";
        }

        function handleAudioSave() {
            // Combine audio chunks into a single file (.webm format is incredibly light)
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            
            console.log("Audio securely saved locally. Size:", audioBlob.size, "bytes");

            // UI Feedback for the Elder
            setTimeout(() => {
                recordBtn.style.backgroundColor = "#2ecc71"; // Back to Green
                recordBtn.innerHTML = "Saved!<br>Thank You";
                statusText.innerText = "Sent safely to the family vault.";
                
                // Reset UI after 3 seconds so they can record another if they want
                setTimeout(() => {
                    recordBtn.innerHTML = "Start<br>Recording";
                    statusText.innerText = "Ready when you are.";
                }, 3000);
            }, 1500); // Simulated delay to show the "Saving..." state

            // Handoff to Cloud Protocol:
            // 1. Check if navigator.onLine is true.
            // 2. If true -> Send audioBlob to Family Google Drive via API.
            // 3. If false -> Keep in IndexedDB and wait for 'online' event listener.
        }
    </script>
</body>
</html>
