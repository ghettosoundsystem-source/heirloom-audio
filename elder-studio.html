<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heirloom Audio - Studio</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --btn-green: #2ecc71;
            --btn-red: #e74c3c;
            --btn-gray: #333333;
            --btn-blue: #3498db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            touch-action: manipulation; 
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        /* Screen Views */
        .view {
            display: none;
            width: 100%;
            max-width: 600px;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        .active-view {
            display: flex;
        }

        .prompt-container {
            margin-bottom: 30px;
        }

        .greeting {
            font-size: 1.1rem;
            color: #aaaaaa;
            margin-bottom: 8px;
        }

        .question {
            font-size: 1.8rem;
            font-weight: bold;
            line-height: 1.3;
        }

        /* Tremor-Proof Record Button */
        .record-btn {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: none;
            background-color: var(--btn-green);
            color: white;
            font-size: 1.6rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: background-color 0.3s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            margin: 0 auto;
        }

        .record-btn:active {
            transform: scale(0.95);
        }

        .recording {
            background-color: var(--btn-red) !important;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
            70% { box-shadow: 0 0 0 25px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        .status-text {
            margin-top: 20px;
            font-size: 1.1rem;
            height: 24px;
            color: #aaaaaa;
        }

        /* Navigation & Action Buttons */
        .nav-btn {
            margin-top: 25px;
            padding: 15px 25px;
            background-color: var(--btn-gray);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
        }

        .nav-btn-blue {
            background-color: var(--btn-blue);
        }

        /* Archive Gallery Styling */
        .archive-list {
            width: 100%;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 5px;
        }

        .archive-card {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }

        .archive-card-header {
            font-size: 0.9rem;
            color: #888;
        }

        .archive-card-title {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .archive-card audio {
            width: 100%;
            margin-top: 5px;
        }

        .empty-archive {
            color: #777;
            margin-top: 40px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- ================= VIEW 1: THE STUDIO (RECORDER) ================= -->
    <div id="studioView" class="view active-view">
        <div class="prompt-container">
            <div class="greeting" id="greetingLabel">Sunday's Question:</div>
            <div class="question" id="promptText">What is your favorite memory of your grandfather?</div>
        </div>

        <button class="record-btn" id="recordBtn">
            Start<br>Recording
        </button>

        <div class="status-text" id="statusText">Ready when you are.</div>

        <button class="nav-btn" id="spontaneousBtn">Record a Spontaneous Memory</button>
        <button class="nav-btn nav-btn-blue" id="openArchiveBtn">View My Recorded Stories</button>
    </div>

    <!-- ================= VIEW 2: THE ARCHIVE (GALLERY) ================= -->
    <div id="archiveView" class="view">
        <h2 style="margin-bottom: 10px;">Your Recorded Memories</h2>
        <p style="color: #aaa; font-size: 0.95rem; margin-bottom: 20px;">Listen back to everything saved on this device.</p>
        
        <div class="archive-list" id="archiveList">
            <!-- Dynamically injected recorded items appear here -->
        </div>

        <button class="nav-btn nav-btn-blue" id="backToStudioBtn" style="margin-top: 30px;">Back to Recorder</button>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let localRecordings = []; // Temporary local array for prototype playback

        const studioView = document.getElementById('studioView');
        const archiveView = document.getElementById('archiveView');
        const recordBtn = document.getElementById('recordBtn');
        const statusText = document.getElementById('statusText');
        const promptText = document.getElementById('promptText');
        const greetingLabel = document.getElementById('greetingLabel');
        const spontaneousBtn = document.getElementById('spontaneousBtn');
        const openArchiveBtn = document.getElementById('openArchiveBtn');
        const backToStudioBtn = document.getElementById('backToStudioBtn');
        const archiveList = document.getElementById('archiveList');

        // Toggle Views
        openArchiveBtn.addEventListener('click', () => {
            studioView.classList.remove('active-view');
            archiveView.classList.add('active-view');
            renderArchive();
        });

        backToStudioBtn.addEventListener('click', () => {
            archiveView.classList.remove('active-view');
            studioView.classList.add('active-view');
        });

        // Spontaneous Memory Mode
        spontaneousBtn.addEventListener('click', () => {
            promptText.innerText = "I remembered something I wanted to share...";
            greetingLabel.innerText = "Spontaneous Memory";
            spontaneousBtn.style.display = "none";
        });

        // Tremor-proof tap-to-toggle record button
        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                await startRecording();
            } else {
                stopRecording();
            }
        });

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = handleAudioSave;
                mediaRecorder.start();
                isRecording = true;

                recordBtn.classList.add('recording');
                recordBtn.innerHTML = "Stop<br>Recording";
                statusText.innerText = "Listening... (Tap when finished)";

            } catch (err) {
                statusText.innerText = "Please allow microphone access.";
                console.error("Mic error:", err);
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
            
            isRecording = false;
            recordBtn.classList.remove('recording');
            recordBtn.style.backgroundColor = "#555";
            recordBtn.innerHTML = "Saving...";
            statusText.innerText = "Securing your memory...";
        }

        function handleAudioSave() {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const audioUrl = URL.createObjectURL(audioBlob);
            
            // Save to our local array with timestamp and current question title
            const memoryItem = {
                title: promptText.innerText,
                date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),
                url: audioUrl
            };
            localRecordings.unshift(memoryItem); // Add to top of list

            setTimeout(() => {
                recordBtn.style.backgroundColor = "var(--btn-green)";
                recordBtn.innerHTML = "Saved!<br>Thank You";
                statusText.innerText = "Saved to Family Vault successfully.";
                
                setTimeout(() => {
                    recordBtn.innerHTML = "Start<br>Recording";
                    statusText.innerText = "Ready when you are.";
                }, 3000);
            }, 1500);
        }

        function renderArchive() {
            archiveList.innerHTML = "";
            
            if (localRecordings.length === 0) {
                archiveList.innerHTML = `<div class="empty-archive">No recordings saved yet. Head back and record your first story!</div>`;
                return;
            }

            localRecordings.forEach((rec, index) => {
                const card = document.createElement('div');
                card.className = 'archive-card';
                card.innerHTML = `
                    <div class="archive-card-header">Saved on ${rec.date}</div>
                    <div class="archive-card-title">"${rec.title}"</div>
                    <audio controls src="${rec.url}"></audio>
                `;
                archiveList.appendChild(card);
            });
        }
    </script>
</body>
</html>
